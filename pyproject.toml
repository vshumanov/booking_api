[project]
name = "hostfully-booking-service"
version = "0.1.0"
description = "RESTful booking service with overlap prevention (DRF + SQLite)"
requires-python = ">=3.10"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-api-key>=3.0,<4.0",
    "drf-spectacular>=0.27,<0.28",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]
